name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ism_agi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ism_agi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ism_agi_test?schema=public
      JWT_SECRET: ci-secret-0123456789abcdef-ci-secret-0123456789abcdef-00
      JWT_EXPIRES_IN: 15m
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
      STORAGE_DRIVER: local
      UPLOAD_DIR: ./test/tmp/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint:ci
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
